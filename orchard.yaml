name: quantumflow
title: QuantumFlow
path: /home/manuel/weichseltree/quantumflow
remote: git@github.com-weichseltree:weichseltree/quantumflow.git

question: >-
  An electron cloud is a far simpler thing than the waves that make it — is the
  cloud alone enough to tell you everything about the matter it came from?

status: active
stage: planted
gpu: jax

phenomena:
  - id: hundred-thousand-wells
    title: A hundred thousand solved wells
    hook: >-
      Every one of these was solved exactly, to the last digit. The machine's
      whole job is to never need the exact solution again.
    evidence: datasets/snyder_2012/train/dataset.hdf5
    hero: false

  - id: nodes-cost-energy
    title: The energy lives at the nodes
    hook: >-
      Paint an orbital with its own kinetic energy and the light collects in
      thin bands around the places where the wave passes through zero. That is
      the whole reason one orbital sits above another.
    evidence: results/models/manifest-standing.json
    hero: true

  - id: convexity-you-can-falsify
    title: A curve with nowhere to hide
    hook: >-
      Two bowls, same network, same seed, one constraint switched off. Look for
      a chord that cuts below the surface: on the constrained bowl there is
      not one, and you are welcome to hunt.
    evidence: results/models/manifest-bowls.json
    hero: true

  - id: penalty-that-cost
    title: A constraint we believed in, measured making it worse
    hook: >-
      We had a good reason to think this penalty would help. It cost accuracy
      at every strength we tried, and the cost grew as we leaned on it harder.
    evidence: outputs/transport/pilot/PILOT_REPORT.md
    hero: false

  - id: modes-held
    title: Whatever it cost, it never lost a mode
    hook: >-
      Every condition, every seed, all eight modes still covered — the penalty
      damaged the fit without ever collapsing it.
    evidence: outputs/transport/pilot/pilot_analysis.json
    hero: false

  - id: evolution-found-zero
    title: Sixteen agents, eight generations, and the winner chose almost nothing
    hook: >-
      Left free to pick the penalty strength for themselves, a bred population
      converged on 0.00037 — the hard way round to the same answer.
    evidence: outputs/transport/pbt/PBT_REPORT.md
    hero: false

