name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate dependencies
        run: python -m pip check
      - name: Test
        run: python -m pytest -m "not orchard"
      - name: Check formatting
        run: >-
          python -m ruff format --check
          quantumflow/cli.py quantumflow/noninteracting_1d/convex.py tests

  orchard-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/checkout@v4
        with:
          repository: weichseltree/orchard
          path: orchard
      - name: Install project and official Orchard stack
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e orchard/packages/tape
          python -m pip install -e orchard
      - name: Validate dependencies
        run: python -m pip check
      - name: Test Orchard integration
        run: python -m pytest -m orchard tests/test_orchard_export.py
