theses:
- id: is-the-cloud-enough
  question: 'If the density really does determine everything, you should be able to run the argument backwards:
    hand the machine a cloud and get back the potential that shaped it. How close does it come?'
  number: Median absolute error of the potential reconstructed from density alone, through mu = dT/dn
    + v, across the 1,000 held-out Snyder systems, as a percentage of each system's own well depth.
  picture: The true potential and the reconstructed one on the same axes, for the worst of the 1,000 —
    not the best.
  phenomena:
  - hundred-thousand-wells
  - nodes-cost-energy
  - convexity-you-can-falsify
  stage: thesis
  episode: Is the cloud enough?
  blocked_by: The convex functional has never been trained against the Snyder set and the reconstruction
    has never been scored. One GPU training run at EXP_PRIO=0 produces the number.
budget:
  gpu_h: 8.0
  cpu_h: 24.0
  tts_chars: 0
  llm_usd: 0.0
  disk_gb: 6.0
  prio_cap: 10
kill: 'If the trained convex functional cannot reconstruct held-out potentials to better than 10% of well
  depth in median absolute error, the inversion does not hang as a result. It hangs as a negative one,
  with that number on the plaque, and the wing''s claim narrows to: the cloud is enough in principle,
  and this is how far short the practice falls.'
potential: 0
notes: 'Exhibition tree for the quantumflow wing off the orangery. The four orangery model families and
  both bowls are built on the CPU from the exact solver and need no training; only the inversion thesis
  needs the GPU lane. Two caveats travel with the artefacts and must reach the plaques: the flow tape''s
  third coordinate is Phi up to an arbitrary additive gauge, so tapes from independently trained models
  are not comparable in height, and the shooting tape''s scrub axis is trial energy, not time.'
